services:
  # PostgreSQL Database
  db:
    image: pgvector/pgvector:0.8.2-pg15-bookworm
    container_name: intaaneto_db
    environment:
      POSTGRES_DB: intaaneto_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intaaneto_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - intaaneto_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intaaneto_backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
      - ./docs:/project-docs:ro
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_NAME=intaaneto_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - FIREBASE_PROJECT_ID=intaaneto-e2f0f
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/docs/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - intaaneto_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intaaneto_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - intaaneto_network

  # Database UI
  adminer:
    image: adminer
    container_name: intaaneto_adminer
    ports:
      - "8888:8080"
    depends_on:
      - db
    networks:
      - intaaneto_network

volumes:
  postgres_data:
  media_files:
  static_files:

networks:
  intaaneto_network:
    driver: bridge
